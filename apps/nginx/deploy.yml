apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: default
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/docker/library/nginx:1.23.4 # {"$imagepolicy": "flux-system:nginx"}
          resources:
            requests:
              memory: 32Mi
              cpu: 5m
            limits:
              memory: "32Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
